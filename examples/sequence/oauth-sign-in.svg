<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1091 1050" width="1091" height="1050" role="img" aria-label="Sign in with OAuth"><style>text{font-family:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif}
.bg-group-box{fill:#f3f3ef;stroke:#84848e;stroke-width:1;stroke-dasharray:4 4}
.bg-group-label,.bg-band-label{fill:#5f5f69;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.bg-band-dot{fill:#ffffff;stroke:#84848e}
.bg-band-num{fill:#5f5f69;font-size:11px;font-weight:600;text-anchor:middle}
.bg-lifeline{stroke:#898993;stroke-width:1;stroke-dasharray:2 4;stroke-linecap:round}
.bg-activation{fill:#e7e7e1;stroke:#84848e;stroke-width:1}
.bg-node-box{fill:#ffffff;stroke:#84848e;stroke-width:1}
.is-external .bg-node-box{stroke-dasharray:5 4}
.is-boundary .bg-node-box{stroke-dasharray:2 3;fill:#f3f3ef}
.bg-node-label{fill:#16161b;font-size:14px;font-weight:600;letter-spacing:-.01em}
.bg-glyph{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.bg-edge-track{fill:none;stroke-width:1.5}
.bg-edge-line{fill:none;stroke-width:1.5;stroke-linecap:round}
.is-return .bg-edge-track,.is-fail .bg-edge-track{stroke-dasharray:6 4}
.is-async .bg-edge-track{stroke-dasharray:.01 4.5;stroke-linecap:round;stroke-width:2}
.is-return .bg-edge-line,.is-async .bg-edge-line,.is-fail .bg-edge-line{stroke-opacity:0}
.bg-edge-label{fill:#16161b;font-size:12px;font-weight:500}
.bg-edge-label-bg{fill:#fbfbf9}
.bg-note-box{fill:#fff3bf;stroke:#c9a52a;stroke-width:1}
.bg-payload-chip-box{fill:#ffffff;stroke-opacity:.55;stroke-width:1;stroke-linejoin:round}
.bg-payload-chip-text{fill:#5f5f69;font-family:ui-monospace,"JetBrains Mono",SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;white-space:pre}
.bg-note-text{fill:#4a3b00;font-size:12px}
</style><defs><marker id="bg-arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3a3a48"/></marker><marker id="bg-arrow-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#7e7e8a" stroke-width="1.6"/></marker><marker id="bg-arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#0c8577" stroke-width="1.6"/></marker><marker id="bg-arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><circle cx="5" cy="5" r="4.2" fill="#fbfbf9" stroke="#cc3a31" stroke-width="1.2"/><path d="M 3.3 3.3 L 6.7 6.7 M 6.7 3.3 L 3.3 6.7" stroke="#cc3a31" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#fbfbf9"/><g class="bg-band"><circle class="bg-band-dot" cx="26" cy="123" r="11"/><text class="bg-band-num" x="26" y="127">1</text><text class="bg-band-label" x="46" y="127">Redirect to the provider</text></g><g class="bg-band"><circle class="bg-band-dot" cx="26" cy="355" r="11"/><text class="bg-band-num" x="26" y="359">2</text><text class="bg-band-label" x="46" y="359">Exchange the code</text></g><g class="bg-band"><circle class="bg-band-dot" cx="26" cy="587" r="11"/><text class="bg-band-num" x="26" y="591">3</text><text class="bg-band-label" x="46" y="591">Open the session</text></g><line class="bg-lifeline" x1="240" y1="82" x2="240" y2="988"/><line class="bg-lifeline" x1="415" y1="82" x2="415" y2="988"/><line class="bg-lifeline" x1="605" y1="82" x2="605" y2="988"/><line class="bg-lifeline" x1="796" y1="82" x2="796" y2="988"/><line class="bg-lifeline" x1="971" y1="82" x2="971" y2="988"/><rect class="bg-activation" x="409" y="184" width="12" height="62" rx="3"/><rect class="bg-activation" x="599" y="308" width="12" height="108" rx="3"/><rect class="bg-activation" x="599" y="478" width="12" height="62" rx="3"/><rect class="bg-activation" x="790" y="648" width="12" height="186" rx="3"/><rect class="bg-activation" x="965" y="710" width="12" height="62" rx="3"/><g class="bg-node is-actor"><rect class="bg-node-box" x="176" y="28" width="128" height="54" rx="27"/><g class="bg-glyph" stroke="#0068a3" transform="translate(196 55.0)"><circle cx="0" cy="-5" r="3.6"/><path d="M 0 -1 L 0 6 M -4.5 2 L 4.5 2 M 0 6 L -3.5 11 M 0 6 L 3.5 11"/></g><text class="bg-node-label" x="212" y="60.0">User</text></g><g class="bg-node is-participant"><rect class="bg-node-box" x="351" y="28" width="128" height="54" rx="12"/><g class="bg-glyph" stroke="#5f5f69" transform="translate(371 55.0)"><rect x="-6" y="-5" width="12" height="11" rx="2"/><path d="M -3 -1 L 3 -1 M -3 2 L 1 2"/></g><text class="bg-node-label" x="387" y="60.0">Web App</text></g><g class="bg-node is-external"><rect class="bg-node-box" x="519" y="28" width="173" height="54" rx="12"/><g class="bg-glyph" stroke="#b0508a" transform="translate(539 55.0)"><path d="M -6 -5 L 6 -5 L 6 6 L -6 6 Z" stroke-dasharray="3 2"/><path d="M -2 0 L 2 0"/></g><text class="bg-node-label" x="555" y="60.0">Identity Provider</text></g><g class="bg-node is-service"><rect class="bg-node-box" x="732" y="28" width="128" height="54" rx="12"/><g class="bg-glyph" stroke="#2f86bf" transform="translate(752 55.0)"><path d="M -6 -5 L 6 -5 L 6 6 L -6 6 Z"/><path d="M -6 -1.5 L 6 -1.5"/></g><text class="bg-node-label" x="768" y="60.0">API</text></g><g class="bg-node is-database"><rect class="bg-node-box" x="907" y="28" width="128" height="54" rx="12"/><g class="bg-glyph" stroke="#00805d" transform="translate(927 55.0)"><ellipse cx="0" cy="-4" rx="6" ry="2.4"/><path d="M -6 -4 L -6 6 A 6 2.4 0 0 0 6 6 L 6 -4"/></g><text class="bg-node-label" x="943" y="60.0">Users DB</text></g><g class="bg-edge is-sync"><path class="bg-edge-track" d="M 240 184 L 409 184" stroke="#3a3a48"/><path class="bg-edge-line" d="M 240 184 L 409 184" stroke="#3a3a48" marker-end="url(#bg-arrow-sync)"/><rect class="bg-edge-label-bg" x="275" y="158" width="99" height="18" rx="4"/><text class="bg-edge-label" x="325" y="171" text-anchor="middle">click Sign in</text></g><g class="bg-edge is-return"><path class="bg-edge-track" d="M 415 246 L 246 246" stroke="#7e7e8a"/><path class="bg-edge-line" d="M 415 246 L 246 246" stroke="#7e7e8a" marker-end="url(#bg-arrow-return)"/><rect class="bg-edge-label-bg" x="261" y="220" width="140" height="18" rx="4"/><text class="bg-edge-label" x="331" y="233" text-anchor="middle">302 to the provider</text></g><g class="bg-edge is-sync"><path class="bg-edge-track" d="M 240 308 L 599 308" stroke="#3a3a48"/><path class="bg-edge-line" d="M 240 308 L 599 308" stroke="#3a3a48" marker-end="url(#bg-arrow-sync)"/><rect class="bg-edge-label-bg" x="357" y="282" width="126" height="18" rx="4"/><text class="bg-edge-label" x="420" y="295" text-anchor="middle">authorize the app</text></g><g class="bg-edge is-return"><path class="bg-edge-track" d="M 605 416 L 421 416" stroke="#7e7e8a"/><path class="bg-edge-line" d="M 605 416 L 421 416" stroke="#7e7e8a" marker-end="url(#bg-arrow-return)"/><rect class="bg-edge-label-bg" x="447" y="390" width="133" height="18" rx="4"/><text class="bg-edge-label" x="513" y="403" text-anchor="middle">callback with code</text></g><g class="bg-edge is-sync"><path class="bg-edge-track" d="M 415 478 L 599 478" stroke="#3a3a48"/><path class="bg-edge-line" d="M 415 478 L 599 478" stroke="#3a3a48" marker-end="url(#bg-arrow-sync)"/><rect class="bg-edge-label-bg" x="457" y="452" width="99" height="18" rx="4"/><text class="bg-edge-label" x="507" y="465" text-anchor="middle">exchange code</text></g><g class="bg-edge is-return"><path class="bg-edge-track" d="M 605 540 L 421 540" stroke="#7e7e8a"/><path class="bg-edge-line" d="M 605 540 L 421 540" stroke="#7e7e8a" marker-end="url(#bg-arrow-return)"/><rect class="bg-edge-label-bg" x="480" y="514" width="66" height="18" rx="4"/><text class="bg-edge-label" x="513" y="527" text-anchor="middle">id_token</text></g><g class="bg-edge is-sync"><path class="bg-edge-track" d="M 415 648 L 790 648" stroke="#3a3a48"/><path class="bg-edge-line" d="M 415 648 L 790 648" stroke="#3a3a48" marker-end="url(#bg-arrow-sync)"/><rect class="bg-edge-label-bg" x="549" y="622" width="106" height="18" rx="4"/><text class="bg-edge-label" x="602" y="635" text-anchor="middle">POST /sessions</text></g><g class="bg-edge is-sync"><path class="bg-edge-track" d="M 796 710 L 965 710" stroke="#3a3a48"/><path class="bg-edge-line" d="M 796 710 L 965 710" stroke="#3a3a48" marker-end="url(#bg-arrow-sync)"/><rect class="bg-edge-label-bg" x="810" y="684" width="140" height="18" rx="4"/><text class="bg-edge-label" x="880" y="697" text-anchor="middle">find or create user</text></g><g class="bg-edge is-return"><path class="bg-edge-track" d="M 971 772 L 802 772" stroke="#7e7e8a"/><path class="bg-edge-line" d="M 971 772 L 802 772" stroke="#7e7e8a" marker-end="url(#bg-arrow-return)"/><rect class="bg-edge-label-bg" x="867" y="746" width="39" height="18" rx="4"/><text class="bg-edge-label" x="886" y="759" text-anchor="middle">user</text></g><g class="bg-edge is-return"><path class="bg-edge-track" d="M 796 834 L 421 834" stroke="#7e7e8a"/><path class="bg-edge-line" d="M 796 834 L 421 834" stroke="#7e7e8a" marker-end="url(#bg-arrow-return)"/><rect class="bg-edge-label-bg" x="555" y="808" width="106" height="18" rx="4"/><text class="bg-edge-label" x="608" y="821" text-anchor="middle">session cookie</text></g><g class="bg-edge is-return"><path class="bg-edge-track" d="M 415 896 L 246 896" stroke="#7e7e8a"/><path class="bg-edge-line" d="M 415 896 L 246 896" stroke="#7e7e8a" marker-end="url(#bg-arrow-return)"/><rect class="bg-edge-label-bg" x="295" y="870" width="72" height="18" rx="4"/><text class="bg-edge-label" x="331" y="883" text-anchor="middle">dashboard</text></g><g class="bg-note"><rect class="bg-note-box" x="345" y="940" width="521" height="44" rx="8"/><text class="bg-note-text" x="359" y="967.0">the token never reaches the browser</text></g></svg>
