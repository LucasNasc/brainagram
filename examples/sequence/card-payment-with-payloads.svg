<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1086 924" width="1086" height="924" role="img" aria-label="Card payment with a failing gateway"><style>text{font-family:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif}
.bg-group-box{fill:#f3f3ef;stroke:#84848e;stroke-width:1;stroke-dasharray:4 4}
