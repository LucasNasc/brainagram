<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2104 292" width="2104" height="292" role="img" aria-label="Order approval"><style>text{font-family:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif}
.bg-group-box{fill:#f3f3ef;stroke:#84848e;stroke-width:1;stroke-dasharray:4 4}
