<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1032 956" width="1032" height="956" role="img" aria-label="File upload"><style>text{font-family:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif}
.bg-group-box{fill:#f3f3ef;stroke:#84848e;stroke-width:1;stroke-dasharray:4 4}
.bg-group-label,.bg-band-label{fill:#5f5f69;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
