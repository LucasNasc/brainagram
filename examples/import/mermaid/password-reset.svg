<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 927 786" width="927" height="786" role="img" aria-label="Password reset"><style>text{font-family:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif}
.bg-group-box{fill:#f3f3ef;stroke:#84848e;stroke-width:1;stroke-dasharray:4 4}
.bg-group-label,.bg-band-label{fill:#5f5f69;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.bg-band-dot{fill:#ffffff;stroke:#84848e}
.bg-band-num{fill:#5f5f69;font-size:11px;font-weight:600;text-anchor:middle}
.bg-lifeline{stroke:#898993;stroke-width:1;stroke-dasharray:2 4;stroke-linecap:round}
.bg-activation{fill:#e7e7e1;stroke:#84848e;stroke-width:1}
.bg-node-box{fill:#ffffff;stroke:#84848e;stroke-width:1}
.is-external .bg-node-box{stroke-dasharray:5 4}
.is-boundary .bg-node-box{stroke-dasharray:2 3;fill:#f3f3ef}
.bg-node-label{fill:#16161b;font-size:14px;font-weight:600;letter-spacing:-.01em}
.bg-glyph{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.bg-edge-track{fill:none;stroke-width:1.5}
.bg-edge-line{fill:none;stroke-width:1.5;stroke-linecap:round}
.is-return .bg-edge-track,.is-fail .bg-edge-track{stroke-dasharray:6 4}
.is-async .bg-edge-track{stroke-dasharray:.01 4.5;stroke-linecap:round;stroke-width:2}
.is-return .bg-edge-line,.is-async .bg-edge-line,.is-fail .bg-edge-line{stroke-opacity:0}
.bg-edge-label{fill:#16161b;font-size:12px;font-weight:500}
.bg-edge-label-bg{fill:#fbfbf9}
.bg-note-box{fill:#fff3bf;stroke:#c9a52a;stroke-width:1}
.bg-payload-chip-box{fill:#ffffff;stroke-opacity:.55;stroke-width:1;stroke-linejoin:round}
.bg-payload-chip-text{fill:#5f5f69;font-family:ui-monospace,"JetBrains Mono",SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;white-space:pre}
.bg-note-text{fill:#4a3b00;font-size:12px}
</style><defs><marker id="bg-arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3a3a48"/></marker><marker id="bg-arrow-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#7e7e8a" stroke-width="1.6"/></marker><marker id="bg-arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#0c8577" stroke-width="1.6"/></marker><marker id="bg-arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><circle cx="5" cy="5" r="4.2" fill="#fbfbf9" stroke="#cc3a31" stroke-width="1.2"/><path d="M 3.3 3.3 L 6.7 6.7 M 6.7 3.3 L 3.3 6.7" stroke="#cc3a31" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#fbfbf9"/><g class="bg-band"><circle class="bg-band-dot" cx="26" cy="123" r="11"/><text class="bg-band-num" x="26" y="127">1</text><text class="bg-band-label" x="46" y="127">Forgot password</text></g><g class="bg-band"><circle class="bg-band-dot" cx="26" cy="293" r="11"/><text class="bg-band-num" x="26" y="297">2</text><text class="bg-band-label" x="46" y="297">email exists</text></g><g class="bg-band"><circle class="bg-band-dot" cx="26" cy="463" r="11"/><text class="bg-band-num" x="26" y="467">3</text><text class="bg-band-label" x="46" y="467">unknown email</text></g><g class="bg-band"><circle class="bg-band-dot" cx="26" cy="571" r="11"/><text class="bg-band-num" x="26" y="575">4</text><text class="bg-band-label" x="46" y="575">never reveal whether the email exists</text></g><line class="bg-lifeline" x1="240" y1="82" x2="240" y2="724"/><line class="bg-lifeline" x1="408" y1="82" x2="408" y2="724"/><line class="bg-lifeline" x1="632" y1="82" x2="632" y2="724"/><line class="bg-lifeline" x1="803" y1="82" x2="803" y2="724"/><rect class="bg-activation" x="402" y="184" width="12" height="514" rx="3"/><rect class="bg-activation" x="626" y="246" width="12" height="170" rx="3"/><rect class="bg-activation" x="797" y="354" width="12" height="366" rx="3"/><g class="bg-node is-actor"><rect class="bg-node-box" x="176" y="28" width="128" height="54" rx="27"/><g class="bg-glyph" stroke="#0068a3" transform="translate(196 55.0)"><circle cx="0" cy="-5" r="3.6"/><path d="M 0 -1 L 0 6 M -4.5 2 L 4.5 2 M 0 6 L -3.5 11 M 0 6 L 3.5 11"/></g><text class="bg-node-label" x="212" y="60.0">User</text></g><g class="bg-node is-participant"><rect class="bg-node-box" x="344" y="28" width="128" height="54" rx="12"/><g class="bg-glyph" stroke="#5f5f69" transform="translate(364 55.0)"><rect x="-6" y="-5" width="12" height="11" rx="2"/><path d="M -3 -1 L 3 -1 M -3 2 L 1 2"/></g><text class="bg-node-label" x="380" y="60.0">Web App</text></g><g class="bg-node is-participant"><rect class="bg-node-box" x="568" y="28" width="128" height="54" rx="12"/><g class="bg-glyph" stroke="#5f5f69" transform="translate(588 55.0)"><rect x="-6" y="-5" width="12" height="11" rx="2"/><path d="M -3 -1 L 3 -1 M -3 2 L 1 2"/></g><text class="bg-node-label" x="604" y="60.0">Auth API</text></g><g class="bg-node is-participant"><rect class="bg-node-box" x="736" y="28" width="135" height="54" rx="12"/><g class="bg-glyph" stroke="#5f5f69" transform="translate(756 55.0)"><rect x="-6" y="-5" width="12" height="11" rx="2"/><path d="M -3 -1 L 3 -1 M -3 2 L 1 2"/></g><text class="bg-node-label" x="772" y="60.0">Mail Service</text></g><g class="bg-edge is-sync"><path class="bg-edge-track" d="M 240 184 L 402 184" stroke="#3a3a48"/><path class="bg-edge-line" d="M 240 184 L 402 184" stroke="#3a3a48" marker-end="url(#bg-arrow-sync)"/><rect class="bg-edge-label-bg" x="265" y="158" width="113" height="18" rx="4"/><text class="bg-edge-label" x="321" y="171" text-anchor="middle">Forgot password</text></g><g class="bg-edge is-sync"><path class="bg-edge-track" d="M 408 246 L 626 246" stroke="#3a3a48"/><path class="bg-edge-line" d="M 408 246 L 626 246" stroke="#3a3a48" marker-end="url(#bg-arrow-sync)"/><rect class="bg-edge-label-bg" x="440" y="220" width="153" height="18" rx="4"/><text class="bg-edge-label" x="517" y="233" text-anchor="middle">POST /password-resets</text></g><g class="bg-edge is-async"><path class="bg-edge-track" d="M 632 354 L 797 354" stroke="#0c8577"/><path class="bg-edge-line" d="M 632 354 L 797 354" stroke="#0c8577" marker-end="url(#bg-arrow-async)"/><rect class="bg-edge-label-bg" x="659" y="328" width="113" height="18" rx="4"/><text class="bg-edge-label" x="715" y="341" text-anchor="middle">send reset link</text></g><g class="bg-edge is-return"><path class="bg-edge-track" d="M 632 416 L 414 416" stroke="#7e7e8a"/><path class="bg-edge-line" d="M 632 416 L 414 416" stroke="#7e7e8a" marker-end="url(#bg-arrow-return)"/><rect class="bg-edge-label-bg" x="477" y="390" width="93" height="18" rx="4"/><text class="bg-edge-label" x="523" y="403" text-anchor="middle">202 Accepted</text></g><g class="bg-edge is-return"><path class="bg-edge-track" d="M 632 524 L 414 524" stroke="#7e7e8a"/><path class="bg-edge-line" d="M 632 524 L 414 524" stroke="#7e7e8a" marker-end="url(#bg-arrow-return)"/><rect class="bg-edge-label-bg" x="430" y="498" width="187" height="18" rx="4"/><text class="bg-edge-label" x="523" y="511" text-anchor="middle">202 Accepted (same answer)</text></g><g class="bg-edge is-return"><path class="bg-edge-track" d="M 408 698 L 246 698" stroke="#7e7e8a"/><path class="bg-edge-line" d="M 408 698 L 246 698" stroke="#7e7e8a" marker-end="url(#bg-arrow-return)"/><rect class="bg-edge-label-bg" x="267" y="672" width="120" height="18" rx="4"/><text class="bg-edge-label" x="327" y="685" text-anchor="middle">Check your inbox</text></g><g class="bg-note"><rect class="bg-note-box" x="338" y="614" width="364" height="44" rx="8"/><text class="bg-note-text" x="352" y="641.0">never reveal whether the email exists</text></g></svg>
