# Brainagram with Docker Compose.
#
#   cp .env.example .env     # fill in SECRET_KEY_BASE and PHX_HOST
#   docker compose up -d     # http://localhost:4000
#
# By default the container runs its own PostgreSQL (data in the
# `brainagram-data` volume). For an external database, set DATABASE_URL in
# `.env` (see .env.example): the embedded PostgreSQL is not started and the
# volume is no longer used.
services:
  brainagram:
    build: .
    image: brainagram
    restart: unless-stopped
    ports:
      - "${PORT_PUBLISHED:-4000}:4000"
    env_file: .env
    volumes:
      - brainagram-data:/app/data

volumes:
  brainagram-data:
